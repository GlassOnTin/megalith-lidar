[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "megalith-lidar"
version = "0.2.0"
description = "Unbiased scale-space terrain segmentation and calibrated national survey for prehistoric monuments in UK 1m LiDAR"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "Pillow>=10.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
